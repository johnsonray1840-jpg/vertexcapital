<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VertexCapitals - Sign In</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <!-- Theme Early Initializer to prevent flash of wrong theme (FOUC) -->
  <script>
    (function() {
      try {
        const theme = localStorage.getItem('vertexcapitals_theme');
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch(e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/d2685dbffe5d4b04.css">
  <link rel="stylesheet" href="css/theme-engine.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#183EFA',
            gold: '#F59E0B',
            dark: '#070A11',
            cardBg: '#0C121E',
            cardBorder: '#1E293B'
          }
        }
      }
    }
  </script>
  <script src="js/nav-fix.js"></script>
  <script src="js/app-store.js"></script>
</head>
<body class="theme-bg theme-text min-h-screen flex items-center justify-center p-4 font-sans antialiased transition-colors duration-200 relative">
  
  <!-- Floating Top Theme Toggle Button -->
  <div class="absolute top-4 right-4 z-50">
    <button onclick="VertexApp.toggleTheme()" class="theme-toggle-btn" title="Toggle Theme (Light / Dark Mode)">
      <svg class="sun-icon w-4 h-4 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      <svg class="moon-icon w-4 h-4 text-slate-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
  </div>

  <div class="max-w-md w-full bg-white dark:bg-[#0c121e] border border-slate-200 dark:border-gray-800/80 rounded-3xl p-8 space-y-6 shadow-2xl relative overflow-hidden">
    <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-[#183EFA] via-[#3B82F6] to-[#183EFA]"></div>

    <div class="text-center space-y-2 pt-2">
      <a href="index.html" class="inline-block">
        <img src="images/navbarlogo.svg" alt="VertexCapitals Logo" class="h-8 mx-auto brand-logo-adaptive">
      </a>
      <h1 class="text-2xl font-bold text-slate-900 dark:text-white mt-4 tracking-tight" id="login-heading">Institutional Sign In</h1>
      <p class="text-xs text-slate-500 dark:text-gray-400" id="login-subheading">Access your active OTC allocations and liquid exchange wallet.</p>
    </div>

    <!-- Login Form -->
    <form id="form-login" onsubmit="handleLoginSubmit(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-gray-300 mb-1.5">Email Address</label>
        <div class="relative">
          <input type="email" id="login-email" required placeholder="name@example.com" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="email" class="w-full bg-slate-50 dark:bg-[#101726] border border-slate-200 dark:border-gray-800 rounded-xl px-4 py-3 text-slate-900 dark:text-white text-sm focus:outline-none focus:border-[#183EFA] transition-colors placeholder-slate-400 dark:placeholder-gray-600">
        </div>
      </div>

      <div>
        <div class="flex justify-between items-center mb-1.5">
          <label class="block text-xs font-semibold text-slate-700 dark:text-gray-300">Password</label>
          <a href="forgotpassword.html" class="text-xs text-primary dark:text-[#38BDF8] hover:underline transition-colors">Forgot password?</a>
        </div>
        <div class="relative">
          <input type="password" id="login-password" required placeholder="••••••••" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="current-password" class="w-full bg-slate-50 dark:bg-[#101726] border border-slate-200 dark:border-gray-800 rounded-xl px-4 py-3 text-slate-900 dark:text-white text-sm focus:outline-none focus:border-[#183EFA] transition-colors placeholder-slate-400 dark:placeholder-gray-600">
        </div>
      </div>

      <button type="submit" id="btn-signin" class="w-full py-3.5 bg-[#183EFA] hover:bg-[#1534D4] text-white font-bold text-sm rounded-xl shadow-lg shadow-blue-900/30 transition-all flex items-center justify-center gap-2">
        <span>Sign In to Account</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </form>

    <!-- Inline OTP Verification Step (if account unverified) -->
    <div id="login-verify-step" class="hidden space-y-6">
      <div class="p-5 bg-primary/10 border border-primary/30 rounded-2xl text-center space-y-2">
        <div class="w-12 h-12 mx-auto rounded-full bg-primary/20 border border-primary/40 flex items-center justify-center text-primary dark:text-[#38BDF8] mb-1">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
        </div>
        <h3 class="font-bold text-slate-900 dark:text-white text-sm tracking-wide">6-Digit Code Dispatched</h3>
        <p class="text-xs text-slate-600 dark:text-gray-300">Enter the verification code sent to <strong id="login-verify-email" class="text-primary dark:text-[#38BDF8] "></strong></p>
      </div>

      <div class="space-y-2">
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-gray-400 text-center">6-Digit Code</label>
        <input type="text" id="login-verify-code" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" autofocus placeholder="• • • • • •" class="w-full bg-slate-50 dark:bg-[#101726] border-2 border-primary/60 rounded-2xl px-4 py-4 text-center text-slate-900 dark:text-white text-2xl font-bold tracking-[0.4em] focus:outline-none focus:border-primary transition-colors">
      </div>

      <button onclick="handleLoginVerifySubmit()" id="btn-login-verify" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm rounded-xl shadow-xl shadow-emerald-500/20 transition-all flex items-center justify-center gap-2">
        <span>Verify & Enter Dashboard</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </button>

      <div class="text-center text-xs text-slate-500 dark:text-gray-400 pt-1 flex justify-between items-center">
        <button onclick="backToLogin()" class="text-slate-500 dark:text-gray-400 hover:text-slate-900 dark:hover:text-white">← Back to Login</button>
        <button onclick="resendLoginCode()" class="text-primary dark:text-[#38BDF8] hover:underline font-semibold">Resend Code</button>
      </div>
    </div>

    <div class="text-center pt-3 border-t border-slate-200 dark:border-gray-800/80">
      <p class="text-xs text-slate-600 dark:text-gray-400">New investor? <a href="register.html" class="text-primary dark:text-[#38BDF8] font-semibold hover:underline">Create an Account</a></p>
    </div>
  </div>

  <script>
    let unverifiedEmail = '';

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-signin');

      btn.disabled = true;
      btn.innerHTML = `<span>Authenticating...</span>`;

      const res = await VertexApp.login(email, pass);
      if (res.success) {
        VertexApp.showToast('Authentication successful. Redirecting...', 'success');
        setTimeout(() => {
          if (res.user.role === 'admin') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'dashboard.html';
          }
        }, 800);
      } else if (res.requiresVerification) {
        unverifiedEmail = email.toLowerCase();
        document.getElementById('form-login').classList.add('hidden');
        document.getElementById('login-verify-step').classList.remove('hidden');
        document.getElementById('login-heading').innerText = 'Verify Your Email';
        document.getElementById('login-subheading').innerText = 'Your account requires 6-digit confirmation before access.';
        document.getElementById('login-verify-email').innerText = unverifiedEmail;
        document.getElementById('login-verify-code').value = '';
        document.getElementById('login-verify-code').focus();
        VertexApp.showToast('Please enter the 6-digit code sent to your email.', 'info');
      } else {
        btn.disabled = false;
        btn.innerHTML = `<span>Sign In to Account</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;
        VertexApp.showToast(res.message || 'Invalid email or password.', 'error');
      }
    }

    async function handleLoginVerifySubmit() {
      const code = document.getElementById('login-verify-code').value.trim();
      const btn = document.getElementById('btn-login-verify');

      if (!code || code.length !== 6) {
        VertexApp.showToast('Please enter the 6-digit verification code.', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<span>Verifying...</span>`;

      const res = await VertexApp.verifyEmailCode(unverifiedEmail, code);
      if (res.success) {
        VertexApp.showToast('Account activated! Entering dashboard...', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 800);
      } else {
        btn.disabled = false;
        btn.innerHTML = `<span>Verify & Enter Dashboard</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`;
        VertexApp.showToast(res.message || 'Invalid or expired 6-digit code.', 'error');
      }
    }

    async function resendLoginCode() {
      if (!unverifiedEmail) return;
      VertexApp.showToast('Dispatching a fresh 6-digit code...', 'info');
      const res = await VertexApp.resendOTP(unverifiedEmail);
      if (res.success) {
        VertexApp.showToast('Fresh code sent to ' + unverifiedEmail, 'success');
      } else {
        VertexApp.showToast(res.message || 'Unable to resend code.', 'error');
      }
    }

    function backToLogin() {
      document.getElementById('login-verify-step').classList.add('hidden');
      document.getElementById('form-login').classList.remove('hidden');
      document.getElementById('login-heading').innerText = 'Institutional Sign In';
      document.getElementById('login-subheading').innerText = 'Access your active OTC allocations and liquid exchange wallet.';
      const btn = document.getElementById('btn-signin');
      btn.disabled = false;
      btn.innerHTML = `<span>Sign In to Account</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;
    }
  </script>
</body>
</html>
