<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VertexCapitals - Password Recovery</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <!-- Theme Early Initializer to prevent flash of wrong theme (FOUC) -->
  <script>
    (function() {
      try {
        const theme = localStorage.getItem('vertexcapitals_theme');
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch(e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/d2685dbffe5d4b04.css">
  <link rel="stylesheet" href="css/theme-engine.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#183EFA',
            gold: '#F59E0B',
            dark: '#070A11',
            cardBg: '#0C121E',
            cardBorder: '#1E293B'
          }
        }
      }
    }
  </script>
  <script src="js/nav-fix.js"></script>
  <script src="js/app-store.js"></script>
</head>
<body class="theme-bg theme-text min-h-screen flex items-center justify-center p-4 font-sans antialiased transition-colors duration-200 relative">
  
  <!-- Floating Top Theme Toggle Button -->
  <div class="absolute top-4 right-4 z-50">
    <button onclick="VertexApp.toggleTheme()" class="theme-toggle-btn" title="Toggle Theme (Light / Dark Mode)">
      <svg class="sun-icon w-4 h-4 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      <svg class="moon-icon w-4 h-4 text-slate-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
  </div>

  <div class="max-w-md w-full bg-white dark:bg-[#0c121e] border border-slate-200 dark:border-gray-800/80 rounded-3xl p-8 space-y-6 shadow-2xl relative overflow-hidden">
    <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-[#183EFA] via-[#3B82F6] to-[#183EFA]"></div>

    <div class="text-center space-y-2 pt-2">
      <a href="index.html" class="inline-block">
        <img src="images/navbarlogo.svg" alt="VertexCapitals Logo" class="h-8 mx-auto brand-logo-adaptive">
      </a>
      <h1 class="text-2xl font-bold text-slate-900 dark:text-white mt-4 tracking-tight">Password Recovery</h1>
      <p class="text-xs text-slate-500 dark:text-gray-400">Enter your registered email to receive a 6-digit authorization code.</p>
    </div>

    <!-- Step 1: Enter Email -->
    <form id="step1-form" onsubmit="handleSendReset(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-gray-300 mb-1.5">Registered Email Address</label>
        <input type="email" id="reset-email" required placeholder="name@example.com" class="w-full bg-slate-50 dark:bg-[#101726] border border-slate-200 dark:border-gray-800 rounded-xl px-4 py-3 text-slate-900 dark:text-white text-sm focus:outline-none focus:border-[#183EFA] transition-colors placeholder-slate-400 dark:placeholder-gray-600">
      </div>

      <button type="submit" id="btn-reset-send" class="w-full py-3.5 bg-[#183EFA] hover:bg-[#1534D4] text-white font-bold text-sm rounded-xl shadow-lg shadow-blue-900/30 transition-all flex items-center justify-center gap-2">
        <span>Send 6-Digit Code via Resend</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </form>

    <!-- Step 2: Code & New Password Form -->
    <form id="step2-form" onsubmit="handleConfirmReset(event)" class="hidden space-y-4">
      <div class="p-4 bg-primary/10 border border-primary/30 rounded-2xl text-xs text-center space-y-1">
        <p class="font-bold text-slate-900 dark:text-white">6-Digit Code Dispatched</p>
        <p class="text-slate-600 dark:text-gray-300">Enter the recovery code dispatched to <strong id="reset-target-email" class="text-primary dark:text-[#38BDF8] "></strong></p>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-gray-400 text-center mb-1.5">6-Digit Recovery Code</label>
        <input type="text" id="reset-code" maxlength="6" required placeholder="• • • • • •" class="w-full bg-slate-50 dark:bg-[#101726] border-2 border-primary/60 rounded-2xl px-4 py-3.5 text-center text-slate-900 dark:text-white text-xl font-bold tracking-[0.4em] focus:outline-none focus:border-primary">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-gray-300 mb-1.5">New Account Password</label>
        <input type="password" id="new-password" required minlength="6" placeholder="••••••••" class="w-full bg-slate-50 dark:bg-[#101726] border border-slate-200 dark:border-gray-800 rounded-xl px-4 py-3 text-slate-900 dark:text-white text-sm focus:outline-none focus:border-[#183EFA]">
      </div>

      <button type="submit" id="btn-reset-confirm" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-emerald-500/20 transition-all flex items-center justify-center gap-2">
        <span>Update Password & Sign In</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </button>

      <div class="text-center text-xs text-slate-500 dark:text-gray-400 pt-1 flex justify-between items-center">
        <button type="button" onclick="backToStep1()" class="text-slate-500 dark:text-gray-400 hover:text-slate-900 dark:hover:text-white transition-colors">← Change Email</button>
        <button type="button" onclick="resendResetCode()" class="text-primary dark:text-[#38BDF8] hover:underline transition-colors font-semibold">Resend Code</button>
      </div>
    </form>

    <div class="text-center pt-3 border-t border-slate-200 dark:border-gray-800/80">
      <p class="text-xs text-slate-600 dark:text-gray-400">Remember your credentials? <a href="login.html" class="text-primary dark:text-[#38BDF8] font-semibold hover:underline">Sign In</a></p>
    </div>
  </div>

  <script>
    let activeResetEmail = '';

    async function handleSendReset(e) {
      e.preventDefault();
      activeResetEmail = document.getElementById('reset-email').value.trim().toLowerCase();
      const btn = document.getElementById('btn-reset-send');

      btn.disabled = true;
      btn.innerHTML = `<span>Dispatching Code...</span>`;

      const res = await VertexApp.forgotPassword(activeResetEmail);
      btn.disabled = false;
      btn.innerHTML = `<span>Send 6-Digit Code via Resend</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;

      if (res.success) {
        document.getElementById('step1-form').classList.add('hidden');
        document.getElementById('step2-form').classList.remove('hidden');
        document.getElementById('reset-target-email').innerText = activeResetEmail;
        document.getElementById('reset-code').value = '';
        document.getElementById('reset-code').focus();
        VertexApp.showToast('Recovery code dispatched to your email!', 'info');
      } else {
        VertexApp.showToast(res.message || 'Error sending recovery code.', 'error');
      }
    }

    async function handleConfirmReset(e) {
      e.preventDefault();
      const code = document.getElementById('reset-code').value.trim();
      const newPass = document.getElementById('new-password').value;
      const btn = document.getElementById('btn-reset-confirm');

      if (!code || code.length !== 6) {
        VertexApp.showToast('Please enter the 6-digit recovery code.', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<span>Updating Password...</span>`;

      const res = await VertexApp.resetPassword(activeResetEmail, code, newPass);
      if (res.success) {
        VertexApp.showToast('Password updated successfully! Redirecting to login...', 'success');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1200);
      } else {
        btn.disabled = false;
        btn.innerHTML = `<span>Update Password & Sign In</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`;
        VertexApp.showToast(res.message || 'Invalid recovery code.', 'error');
      }
    }

    async function resendResetCode() {
      if (!activeResetEmail) return;
      VertexApp.showToast('Dispatching a fresh 6-digit recovery code...', 'info');
      const res = await VertexApp.forgotPassword(activeResetEmail);
      if (res.success) {
        VertexApp.showToast('Fresh recovery code sent to ' + activeResetEmail, 'success');
      } else {
        VertexApp.showToast(res.message || 'Unable to resend code.', 'error');
      }
    }

    function backToStep1() {
      document.getElementById('step2-form').classList.add('hidden');
      document.getElementById('step1-form').classList.remove('hidden');
      const btn = document.getElementById('btn-reset-send');
      btn.disabled = false;
      btn.innerHTML = `<span>Send 6-Digit Code via Resend</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;
    }
  </script>
</body>
</html>
